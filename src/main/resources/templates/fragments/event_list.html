<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="list">
    <div class="row between">
        <h3 th:text="${city}">City</h3>
        <div class="filters">
            <label>
                <input type="checkbox"
                       th:checked="${upcomingOnly}"
                       hx-get=""
                       th:hx-get="@{'/home/cities/' + ${city} + '/events'(region=${region}, upcomingOnly=${!upcomingOnly}, page=${0})}"
                       hx-target="#events"
                       hx-swap="innerHTML"
                       hx-indicator="#hx-indicator"/>
                Upcoming only
            </label>
        </div>
    </div>

    <div class="list">
        <article class="item" th:each="e : ${page.content}">
            <div class="item-main">
                <h4 th:text="${e.title}">Title</h4>
                <p class="muted" th:text="${e.description}">Desc</p>
            </div>
            <div class="item-meta">
                <div th:text="${e.venueName}">Venue</div>
                <div th:text="${e.addressLine}">Addr</div>
                <div>
                    <span th:text="${e.city}">City</span>,
                    <span th:text="${e.region}">ST</span>
                </div>
                <div class="time">
                    <span th:text="${#temporals.format(e.startAt, 'MMM d, yyyy HH:mm z')}">start</span>
                    →
                    <span th:text="${#temporals.format(e.endAt, 'MMM d, yyyy HH:mm z')}">end</span>
                </div>
            </div>
        </article>
    </div>

    <div class="pager row between">
        <button class="btn"
                th:disabled="${page.first}"
                hx-get=""
                th:hx-get="@{'/home/cities/' + ${city} + '/events'(region=${region}, upcomingOnly=${upcomingOnly}, page=${page.number - 1}, size=${page.size})}"
                hx-target="#events" hx-swap="innerHTML" hx-indicator="#hx-indicator">Prev</button>

        <span class="muted">Page <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span></span>

        <button class="btn"
                th:disabled="${page.last}"
                hx-get=""
                th:hx-get="@{'/home/cities/' + ${city} + '/events'(region=${region}, upcomingOnly=${upcomingOnly}, page=${page.number + 1}, size=${page.size})}"
                hx-target="#events" hx-swap="innerHTML" hx-indicator="#hx-indicator">Next</button>
    </div>
</div>
</body>
</html>
