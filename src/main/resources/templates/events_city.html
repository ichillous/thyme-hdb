<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:with="title=${'Events in ' + city}, stateCode=${state}"
      th:replace="~{base :: layout(~{::section})}">
<section class="stack">
    <div class="row between">
        <h2>
            <span>Islamic Events in </span><span th:text="${city}">City</span>
            <small class="muted" th:text="${stateCode ?: '—'}">ST</small>
        </h2>

        <form class="row" method="get" th:action="@{/home/cities/{city}(city=${city})}">
            <input type="hidden" name="state" th:value="${state}"/>
            <label class="sr-only" for="city-search">Search title or venue</label>
            <input id="city-search" type="search" name="q" placeholder="Search title or venue" th:value="${q}" />
            <label class="sr-only" for="date-filter">Date range</label>
            <select id="date-filter" name="date" aria-label="Filter by date range">
                <option th:value="ALL" th:selected="${date.name()=='ALL'}">All dates</option>
                <option th:value="WEEK" th:selected="${date.name()=='WEEK'}">This week</option>
                <option th:value="MONTH" th:selected="${date.name()=='MONTH'}">This month</option>
            </select>
            <label class="sr-only" for="sort-order">Sort order</label>
            <select id="sort-order" name="sort" aria-label="Sort order">
                <option th:value="NEWEST" th:selected="${sort.name()=='NEWEST'}">Newest first</option>
                <option th:value="SOONEST" th:selected="${sort.name()=='SOONEST'}">Soonest first</option>
            </select>
            <button class="btn" type="submit">Apply</button>
        </form>
    </div>

    <div class="card">
        <div class="list">
            <article class="item" th:each="e : ${page.content}">
                <div class="item-main">
                    <h4 class="item-title" th:text="${e.title}">Title</h4>
                    <p class="muted clamp-3" th:text="${e.description}">Desc</p>
                    <div class="muted tiny" th:if="${e.ownerOrgId != null}">
                        <a th:href="@{'/org/' + ${e.ownerOrgId}}">View organizer</a>
                    </div>

                    <div class="row actions gap-sm">
                        <a class="btn" th:href="@{'/events/' + ${e.eventId}}" th:attr="aria-label=${'View details for ' + e.title}">View details</a>

                        <!-- Heart button target (no liked/count passed; defaults inside fragment) -->
                        <span th:id="'heart-' + ${e.eventId}"
                              th:with="liked=${likedEventIds != null ? likedEventIds.contains(e.eventId) : false},
                                       count=${likeCounts != null ? (likeCounts[e.eventId] ?: 0) : 0}"
                              th:insert="~{fragments/event_heart :: button(
                                  eventId=${e.eventId},
                                  actorUserId=${actorUserId},
                                  liked=${liked},
                                  count=${count}
                              )}">
                        </span>
                    </div>
                </div>

                <div class="item-meta">
                    <div th:with="p=${ownerProfiles != null ? ownerProfiles[e.ownerOrgId] : null},
                                   vName=${e.venueName},
                                   vAddr=${e.addressLine != null ? e.addressLine : (p != null ? p.addressLine1 : null)},
                                   vCity=${e.city != null ? e.city : (p != null ? p.city : null)},
                                   vState=${e.stateProvince != null ? e.stateProvince.name() : (p != null && p.stateProvince != null ? p.stateProvince.name() : null)}">
                        <div th:text="${vName != null and !#strings.isEmpty(vName) ? vName : (p != null ? p.displayName : 'Venue')}">Venue</div>
                        <div th:text="${vAddr != null ? vAddr : '—'}">Addr</div>
                        <div><span th:text="${vCity != null ? vCity : '—'}">City</span>, <span th:text="${vState != null ? vState : '—'}">ST</span></div>
                    </div>
                    <div class="time">
                        <span th:text="${#temporals.format(e.startAtZoned,'MMM d, yyyy HH:mm z')}">start</span> →
                        <span th:text="${#temporals.format(e.endAtZoned,'MMM d, yyyy HH:mm z')}">end</span>
                    </div>
                </div>
            </article>
            <div class="empty" th:if="${page.content.isEmpty()}">No events match your filters.</div>
        </div>

        <div class="pager row between" th:if="${page.totalPages > 1}">
            <a class="btn" th:if="${!page.first}"
               th:href="@{/home/cities/{city}(city=${city},state=${state},q=${q},date=${date},sort=${sort},page=${page.number-1})}">Prev</a>

            <span class="muted">
                Page <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span>
            </span>

            <a class="btn" th:if="${!page.last}"
               th:href="@{/home/cities/{city}(city=${city},state=${state},q=${q},date=${date},sort=${sort},page=${page.number+1})}">Next</a>
        </div>
    </div>
</section>
</html>
